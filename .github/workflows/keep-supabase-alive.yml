# Garde le projet Supabase actif.
#
# Le free tier met en pause le projet après 7 jours d'inactivité (mesurée sur
# les requêtes API entrantes). Deux pings quotidiens suffisent, sans écrire ni
# lire aucune donnée :
#   1. GET /rest/v1/profiles?select=*&limit=0  → PostgREST répond 200 avec
#      zéro ligne (limit=0), même si la RLS bloque l'accès anon.
#   2. GET /auth/v1/health                      → health check du service Auth.
#
# NB : la racine /rest/v1/ (spec OpenAPI) est désormais réservée à la clé
# service_role sur les projets récents — d'où ces deux endpoints alternatifs.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   - SUPABASE_URL        ex: https://xxxxxxxx.supabase.co
#   - SUPABASE_ANON_KEY   la clé anon (publique par design, jamais service_role)

name: Keep Supabase Alive

on:
  schedule:
    # Tous les jours à 03:17 UTC (minutes décalées pour éviter les pics
    # de charge des cron "pile" de GitHub).
    - cron: "17 3 * * *"
  # Permet aussi de déclencher le workflow manuellement depuis l'onglet Actions.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (REST + Auth)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Nettoyage des copier-coller : espaces / retours à la ligne parasites.
          SUPABASE_URL="$(printf '%s' "${SUPABASE_URL}" | tr -d '[:space:]' | sed 's:/*$::')"
          SUPABASE_ANON_KEY="$(printf '%s' "${SUPABASE_ANON_KEY}" | tr -d '[:space:]')"
          export SUPABASE_URL SUPABASE_ANON_KEY

          # Garde-fou : message explicite si un secret est introuvable ou vide.
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "❌ Secret manquant ou vide :"
            [ -z "${SUPABASE_URL}" ] && echo "   - SUPABASE_URL (attendu : https://xxxxxxxx.supabase.co)"
            [ -z "${SUPABASE_ANON_KEY}" ] && echo "   - SUPABASE_ANON_KEY (attendu : la clé anon)"
            echo ""
            echo "   Vérifier dans Settings → Secrets and variables → Actions →"
            echo "   Repository secrets (pas Variables, pas Environments), sur ce repo,"
            echo "   avec ces noms EXACTS. Les secrets vides ou renommés donnent"
            echo "   exactement l'erreur curl 'No host part in the URL'."
            exit 1
          fi

          # Un ping = GET avec la clé anon ; 2xx = OK. Tout échec rend le run
          # rouge → email de GitHub → alerte gratuite.
          ping() {
            local label="$1" path="$2" code
            code=$(curl -sS -o /tmp/ping_body.json -w "%{http_code}" \
              --max-time 30 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              "${SUPABASE_URL}${path}")
            echo "${label} -> HTTP ${code}"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              return 0
            else
              echo "   Réponse : $(head -c 200 /tmp/ping_body.json)"
              return 1
            fi
          }

          failed=0

          # 1) Requête PostgREST (le signal d'activité le plus direct).
          #    NB : si la table "profiles" est un jour renommée/supprimée,
          #    ce ping échouera → run rouge → à corriger ici.
          ping "REST /rest/v1/profiles?select=*&limit=0" \
            "/rest/v1/profiles?select=*&limit=0" || failed=1

          # 2) Health check du service Auth.
          ping "AUTH /auth/v1/health" "/auth/v1/health" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "❌ Au moins un ping a échoué — voir ci-dessus."
            exit 1
          fi

          echo "✅ Supabase est actif (2 pings OK, aucune donnée lue ni écrite)."
